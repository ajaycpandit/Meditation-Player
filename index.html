<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Player</title>
<meta name="theme-color" content="#0b0f2a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Calm night sky (dark) / warm ivory (light) ===== */
:root{
  --r:18px;
  --bg:#0b0f2a;
  --bg-grad:radial-gradient(1200px 700px at 12% -10%,#26337a 0%,transparent 60%),radial-gradient(900px 620px at 110% 8%,#0f5a64 0%,transparent 55%),linear-gradient(180deg,#0b0f2a 0%,#0a1a2e 55%,#08202a 100%);
  --stars:radial-gradient(1.2px 1.2px at 8% 22%,rgba(255,255,255,.75),transparent 60%),radial-gradient(1px 1px at 27% 68%,rgba(255,255,255,.55),transparent 60%),radial-gradient(1.4px 1.4px at 46% 12%,rgba(255,244,214,.8),transparent 60%),radial-gradient(1px 1px at 63% 44%,rgba(255,255,255,.5),transparent 60%),radial-gradient(1.2px 1.2px at 78% 76%,rgba(255,255,255,.6),transparent 60%),radial-gradient(1px 1px at 91% 31%,rgba(255,244,214,.7),transparent 60%),radial-gradient(1px 1px at 15% 88%,rgba(255,255,255,.45),transparent 60%),radial-gradient(1.3px 1.3px at 55% 92%,rgba(255,255,255,.5),transparent 60%);
  --hdr:rgba(11,15,42,.62);
  --card:rgba(255,255,255,.055);--card-solid:#151b3f;--field:rgba(255,255,255,.05);
  --ink:#eef0fb;--mute:#a9afd2;--line:rgba(255,255,255,.11);
  --gold:#e9c46a;--gold-soft:rgba(233,196,106,.12);--teal:#62d2d8;
  --acc-ink:#1b1630;--chip:rgba(255,255,255,.07);
  --pri-bg:linear-gradient(135deg,#f3d78f,#d6a446);
  --warn:#f3c26b;--bad:#ff9a9a;
  --glow:0 0 0 1px rgba(233,196,106,.45),0 0 26px rgba(233,196,106,.20);
  --shadow:0 12px 32px rgba(0,0,0,.32);
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root{
  --bg:#fbf7ee;
  --bg-grad:radial-gradient(1000px 600px at 8% -12%,#dff0ec 0%,transparent 60%),radial-gradient(800px 520px at 108% 0%,#fbe6cf 0%,transparent 55%),linear-gradient(180deg,#fbf7ee,#f5efe2);
  --stars:none;
  --hdr:rgba(251,247,238,.78);
  --card:rgba(255,255,255,.74);--card-solid:#fffdf8;--field:#fff;
  --ink:#1d2536;--mute:#677086;--line:rgba(30,55,75,.12);
  --gold:#a8771f;--gold-soft:rgba(168,119,31,.10);--teal:#0f7c86;
  --acc-ink:#fff;--chip:rgba(15,124,134,.07);
  --pri-bg:linear-gradient(135deg,#15939d,#0e6d78);
  --warn:#9a5d06;--bad:#b42318;
  --glow:0 0 0 1px rgba(15,124,134,.40),0 6px 22px rgba(15,124,134,.14);
  --shadow:0 10px 26px rgba(70,55,25,.08);
  color-scheme:light;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:clamp(15px,0.55vw + 12.5px,21px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--stars),var(--bg-grad);pointer-events:none}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
a{color:var(--teal)}
svg.i{width:1.1em;height:1.1em;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em}
svg.i.fill{fill:currentColor;stroke:none}
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:.6rem;padding:.65rem max(1rem,env(safe-area-inset-left));background:var(--hdr);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header.top h1{margin:0;flex:1;font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:1.55rem;letter-spacing:.01em;color:var(--ink)}
header.top h1 .star{color:var(--gold);margin-right:.25rem}
.chip{background:var(--chip);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:.4rem .9rem;font:inherit;font-size:.9rem;cursor:pointer}
nav.tabs{display:flex;gap:.25rem;margin:1rem 0;padding:.3rem;background:var(--chip);border:1px solid var(--line);border-radius:999px;overflow-x:auto}
nav.tabs button{flex:1;min-width:5.2rem;padding:.6rem .8rem;border:0;background:transparent;color:var(--mute);border-radius:999px;font:inherit;font-weight:600;cursor:pointer;transition:background .2s,color .2s}
nav.tabs button.on{background:var(--pri-bg);color:var(--acc-ink);box-shadow:var(--glow)}
main{max-width:1060px;margin:0 auto;padding:0 1rem 5rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.2rem;margin:1rem 0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow)}
.card h2,.label{font-size:.74rem;margin:0 0 .65rem;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.14em}
.big{font-size:1.2rem;font-weight:700}
button.btn{font:inherit;font-size:.92rem;padding:.55rem 1.05rem;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer;min-height:2.5rem;transition:border-color .2s,transform .1s}
button.btn:hover{border-color:var(--gold)}
button.btn:active{transform:scale(.97)}
button.pri{background:var(--pri-bg);color:var(--acc-ink);border-color:transparent;font-weight:700}
button.danger{color:var(--bad)}
button.sm{padding:.3rem .75rem;min-height:2.1rem;min-width:2.3rem;font-size:.85rem}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{font:inherit;padding:.6rem .8rem;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--ink);min-height:2.6rem;width:100%}
textarea{resize:vertical;line-height:1.5}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.row>input{flex:1;min-width:9rem;width:auto}
.sp{flex:1}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:.5rem;padding:.55rem 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list li.cur{background:var(--gold-soft);border-radius:10px;padding-left:.4rem}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:2.6rem;height:2.2rem;padding:0 .35rem;border-radius:10px;background:var(--gold-soft);color:var(--gold);font-weight:800;font-variant-numeric:tabular-nums}
.src{font-size:.7rem;padding:.1rem .45rem;border-radius:999px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.src.yt{color:#ff7b7b;border-color:currentColor}
.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mute{color:var(--mute)}
.warn{color:var(--warn)}
/* player */
#player{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:1rem 0;overflow:hidden;box-shadow:var(--shadow),var(--glow);scroll-margin-top:5rem}
/* The stage gets its own compositing layer: embedded YouTube/Drive players inside a rounded,
   clipped box otherwise sometimes don't repaint until something else on the page changes. */
#stage{position:relative;background:#000;aspect-ratio:16/9;max-height:72vh;width:100%;isolation:isolate;transform:translateZ(0)}
/* Embedded players stay rendered while not in use (hidden, not removed) so they don't come back blank. */
#ytwrap[hidden],#drvframe[hidden]{display:block!important;visibility:hidden;pointer-events:none}
#stage video,#ytwrap,#ytwrap iframe,#drvframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#audioart{position:absolute;inset:0 0 3.5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;color:#fff;text-align:center;padding:1rem;pointer-events:none;background:radial-gradient(circle at 50% 42%,#2c3a82 0%,#121845 38%,#05071a 75%)}
#audioart .note{font-size:3.4rem;line-height:1;color:#e9c46a;text-shadow:0 0 28px rgba(233,196,106,.6)}
#audioart .ttl{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.6rem;font-weight:600;max-width:90%;overflow-wrap:anywhere}
#tapplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:1.3rem;padding:.9rem 1.6rem;z-index:2}
#stage:fullscreen{max-height:none;aspect-ratio:auto}
.now{padding:.8rem 1.1rem}
.controls{display:flex;gap:.5rem;flex-wrap:wrap;padding:0 1.1rem 1rem}
#toast{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);background:var(--card-solid);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow),var(--glow);padding:.65rem 1.1rem;border-radius:999px;z-index:30;max-width:90vw;text-align:center}
#authbar{position:sticky;top:0;z-index:10;background:#f3c26b;color:#1b1630;padding:.6rem 1rem;display:flex;gap:.75rem;align-items:center;justify-content:center;flex-wrap:wrap}
#gate{max-width:34rem;margin:3.5rem auto;padding:1.6rem;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);backdrop-filter:blur(10px)}
#gate h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:2rem;font-weight:600;margin:.2rem 0 .6rem}
#gate p{margin:.5rem 0}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(12rem,1fr));gap:.6rem}
.days label{display:flex;flex-direction:column;gap:.25rem;font-size:.9rem;color:var(--mute)}
code{background:var(--chip);padding:.05rem .35rem;border-radius:6px}
/* play tab */
.today{background:linear-gradient(135deg,rgba(233,196,106,.16),rgba(98,210,216,.08)),var(--card)}
.quickbar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.8rem 1rem}
.quickbar label{font-size:.74rem;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.14em;white-space:nowrap}
.quickbar input{flex:1;min-width:10rem;width:auto}
/* catalog */
.cattools{display:grid;gap:.7rem;margin:1.2rem 0 .2rem}
.fchips{display:flex;flex-wrap:wrap;gap:.45rem}
.fchip{display:inline-flex;align-items:center;gap:.4rem;padding:.42rem .85rem;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--mute);font:inherit;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s}
.fchip:hover{color:var(--ink);border-color:var(--gold)}
.fchip.on{background:var(--pri-bg);color:var(--acc-ink);border-color:transparent;box-shadow:var(--glow)}
.fchips .sep{width:1px;background:var(--line);margin:0 .2rem}
.catsec{padding:0;overflow:hidden}
.secbtn{display:flex;align-items:center;gap:.7rem;background:none;border:0;padding:0;margin:0;color:inherit;font:inherit;text-align:left;cursor:pointer;flex:1;min-width:12rem}
.secbtn .chev{display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;border:1px solid var(--line);color:var(--gold);flex:0 0 auto;transition:transform .25s}
.catsec.closed .chev{transform:rotate(-90deg)}
.catsec.closed .sechead{border-bottom:0}
.seccount{display:block;font-size:.78rem;color:var(--mute);margin-top:.2rem}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;padding:1rem 1.2rem .85rem;border-bottom:1px solid var(--line);background:linear-gradient(90deg,var(--gold-soft),transparent 70%)}
.card h2.sectitle{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.6rem;font-weight:600;margin:0;line-height:1.1;color:var(--ink);text-transform:none;letter-spacing:.005em}
.sectag{display:inline-block;margin-top:.35rem;font-size:.7rem;font-weight:700;letter-spacing:.06em;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:.08rem .55rem;opacity:.85}
.cilist{list-style:none;margin:0;padding:.35rem .5rem .55rem}
.ci{border-radius:14px;padding:.6rem .65rem;transition:background .2s,box-shadow .3s}
.ci+.ci{border-top:1px solid var(--line)}
.ci:hover{background:var(--chip)}
.ci.now{background:var(--gold-soft);box-shadow:var(--glow);border-top-color:transparent}
.ci.now+.ci{border-top-color:transparent}
.ci-main{display:flex;align-items:center;gap:.75rem}
.part{flex:0 0 auto;min-width:3.7rem;text-align:center;font-size:.76rem;font-weight:800;color:var(--gold);background:var(--gold-soft);border-radius:10px;padding:.38rem .4rem;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.ci-text{flex:1;min-width:0}
.ci-title{font-weight:700;font-size:1rem;line-height:1.3}
.ci-meta{display:flex;align-items:center;flex-wrap:wrap;gap:.5rem;margin-top:.22rem;font-size:.8rem;color:var(--mute)}
.tagi{display:inline-flex;align-items:center;gap:.2rem;color:var(--gold)}
.tagi svg.i{width:1.05rem;height:1.05rem}
.ci.unlinked .ci-title{opacity:.62}
.playbtn{flex:0 0 auto;width:2.8rem;height:2.8rem;border-radius:50%;display:grid;place-items:center;border:0;background:var(--pri-bg);color:var(--acc-ink);cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .15s,box-shadow .2s;font-size:1.05rem;font-weight:800}
.playbtn:hover{transform:scale(1.07);box-shadow:var(--glow)}
.playbtn svg.i{width:1.15rem;height:1.15rem;margin-left:.12rem}
.playbtn.off{background:var(--chip);color:var(--mute);opacity:.45;box-shadow:none;cursor:default;transform:none}
.iconbtn{flex:0 0 auto;width:2.35rem;height:2.35rem;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:transparent;color:var(--mute);cursor:pointer;transition:all .2s}
.iconbtn:hover,.iconbtn.on{color:var(--gold);border-color:var(--gold)}
.ci-intro{display:flex;align-items:center;flex-wrap:wrap;gap:.5rem;margin:.5rem 0 .1rem 4.45rem;font-size:.86rem;color:var(--mute)}
.ci-intro b{color:var(--ink);font-weight:600}
.ci-note{margin:.55rem 0 .15rem 4.45rem;padding:.7rem .95rem;background:var(--chip);border-left:3px solid var(--gold);border-radius:0 12px 12px 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.92rem;line-height:1.55}
.catfoot{margin:1rem 0}
.empty{padding:.8rem;color:var(--mute)}
@media (max-width:560px){
  nav.tabs{gap:.1rem;padding:.25rem}
  nav.tabs button{min-width:0;padding:.55rem .35rem;font-size:.82rem}
  .ci-intro,.ci-note{margin-left:0}
  .part{min-width:3.1rem}
  .card h2.sectitle{font-size:1.4rem}
  header.top h1{font-size:1.35rem}
}
.drvnote{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem;font-size:.9rem;color:var(--mute);border-top:1px solid var(--line)}
.drvnote b{color:var(--ink)}
.drvnote a.btn{text-decoration:none;display:inline-flex;align-items:center;font-size:.85rem;padding:.3rem .75rem;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink)}
/* history */
.lastp{color:var(--teal)}
.hrow .htime{flex:0 0 4.6rem;font-size:.82rem;color:var(--mute);font-variant-numeric:tabular-nums}
.hrow .t{white-space:normal}
.hrow .hs{display:block;font-size:.8rem;color:var(--mute)}
.hrow .ok{color:var(--teal);font-weight:700}
.hstats{display:flex;gap:1.4rem;flex-wrap:wrap}
.hstats div b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:2rem;line-height:1.1;color:var(--gold)}
.todayrow+.todayrow{margin-top:.6rem;padding-top:.6rem;border-top:1px solid var(--line)}
/* calendar */
.calhead{display:flex;align-items:center;gap:.5rem;margin-bottom:.7rem}
.calhead .mname{flex:1;font-family:"Cormorant Garamond",Georgia,serif;font-size:1.6rem;font-weight:600}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.3rem}
.caldow{font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:center;padding:.2rem 0}
.calcell{min-height:5.4rem;border-radius:12px;background:var(--chip);border:1px solid var(--line);padding:.3rem;text-align:left;display:flex;flex-direction:column;gap:.18rem;font:inherit;color:inherit;cursor:pointer;overflow:hidden;min-width:0;transition:border-color .2s}
.calcell:hover{border-color:var(--gold)}
.calcell.blank{visibility:hidden}
.calcell.past{opacity:.72}
.calcell.sel{border-color:var(--gold);box-shadow:var(--glow);opacity:1}
.dnum{font-weight:800;font-size:.82rem;width:1.65rem;height:1.65rem;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.calcell.today .dnum{background:var(--pri-bg);color:var(--acc-ink)}
.pchip{font-size:.68rem;line-height:1.25;padding:.1rem .35rem;border-radius:6px;background:var(--gold-soft);color:var(--gold);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip.wk{background:transparent;border:1px dashed var(--gold);opacity:.85}
.pmore{font-size:.66rem;color:var(--mute)}
.played{margin-top:auto;font-size:.68rem;font-weight:700;color:var(--teal)}
.daypanel{margin-top:1rem;padding-top:1rem;border-top:1px solid var(--line)}
.daypanel h3{margin:0 0 .5rem;font-family:"Cormorant Garamond",Georgia,serif;font-size:1.45rem;font-weight:600}
.daypanel select{width:auto;flex:1;min-width:10rem}
@media (max-width:560px){
  .calcell{min-height:3.7rem;padding:.2rem;gap:.12rem}
  .pchip{font-size:0;height:.42rem;padding:0;border-radius:99px}
  .pmore{display:none}
  .played{font-size:.6rem}
}
/* select mode */
.selbtn{flex:0 0 auto;width:2.8rem;height:2.8rem;border-radius:50%;display:grid;place-items:center;border:2px solid var(--gold);background:transparent;color:var(--acc-ink);font:inherit;font-weight:800;font-size:1rem;cursor:pointer;transition:all .15s}
.selbtn.on{background:var(--pri-bg);border-color:transparent;box-shadow:var(--glow)}
.selbtn:disabled{border-color:var(--line);opacity:.4;cursor:default}
.ci-main[data-act=cisel]{cursor:pointer}
.ci.sel{background:var(--gold-soft)}
#selbar{position:fixed;left:50%;bottom:max(1rem,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;width:min(760px,calc(100vw - 1.5rem));display:flex;align-items:center;flex-wrap:wrap;gap:.5rem .6rem;padding:.7rem .9rem;background:var(--card-solid);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow),var(--glow)}
#selbar .count{font-weight:800;color:var(--gold);margin-right:.2rem}
#selbar label.cb{padding:.32rem .7rem;font-size:.85rem}
body.has-sel main{padding-bottom:9rem}
body.has-sel #toast{bottom:8.5rem}
/* editor dialog */
dialog#cidlg{width:min(560px,calc(100vw - 1.5rem));max-height:calc(100dvh - 1.5rem);overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card-solid);color:var(--ink);padding:1.3rem 1.3rem 1.1rem;box-shadow:var(--shadow),var(--glow)}
dialog#cidlg::backdrop{background:rgba(5,8,25,.62);backdrop-filter:blur(3px)}
#cidlg h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.7rem;font-weight:600;margin:0 0 .8rem}
#cidlg label.f{display:grid;gap:.3rem;margin:.7rem 0;font-size:.85rem;color:var(--mute);font-weight:600}
#cidlg label.f small{font-weight:400}
.hint{font-size:.8rem;font-weight:400;min-height:1em}
.hint.ok{color:var(--teal)}
.hint.bad{color:var(--bad)}
.grid2{display:grid;grid-template-columns:7rem 1fr;gap:.6rem}
fieldset{border:0;padding:0;margin:.7rem 0;display:flex;flex-wrap:wrap;gap:.45rem;align-items:center}
legend{font-size:.85rem;color:var(--mute);font-weight:600;padding:0;margin-bottom:.35rem;width:100%}
.cb{display:inline-flex;align-items:center;gap:.4rem;padding:.42rem .85rem;border-radius:999px;border:1px solid var(--line);background:var(--chip);cursor:pointer;font-size:.9rem;font-weight:600;color:var(--ink)}
.cb input{width:auto;min-height:0;margin:0;accent-color:#d6a446}
.cb:has(input:checked){background:var(--pri-bg);color:var(--acc-ink);border-color:transparent}
.cb svg.i{color:inherit}
</style>
</head>
<body>
<div id="authbar" hidden><span>Google sign-in expired.</span><button class="btn" data-act="reauth">Sign in again</button></div>
<div id="gate"></div>

<div id="app" hidden>
  <header class="top"><h1><span class="star">✦</span>Family Player</h1><button class="chip" id="profchip" data-act="switchprofile"></button></header>
  <main>
    <section id="player" hidden>
      <div id="stage">
        <video id="vid" controls playsinline preload="metadata"></video>
        <div id="ytwrap" hidden><div id="ytmount"></div></div>
        <div id="audioart" hidden></div>
        <iframe id="drvframe" hidden title="Google Drive player" allow="autoplay; fullscreen" allowfullscreen></iframe>
        <button id="tapplay" class="btn pri" hidden>▶ Tap to play</button>
      </div>
      <div class="now" id="now"></div>
      <div class="now warn" id="diag" hidden></div>
      <div class="now drvnote" id="drvnote" hidden></div>
      <div class="controls">

    const r = part.match(/^(\d+)-(\d+)$/);

      for (let n = a; n !== b + step; n += step) nums.push(n);

function applySync(cfg, files){

  const known = new Map(cfg.items.filter(i => i.type === 'drive').map(i => [i.id, i]));
  for (const it of known.values()){
    const miss = !present.has(it.id);
    if (!!it.missing !== miss){ if (miss) it.missing = true; else delete it.missing; changed = true; }
  }
  files.slice().sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' })).forEach(f => {
    const it = known.get(f.id);
    if (it){
      if (f.size && it.size !== f.size){ it.size = f.size; changed = true; }
      if (it.file !== f.name){ it.file = f.name; changed = true; }
      if (f.media && it.media !== f.media){ it.media = f.media; changed = true; }
      if (f.noDownload !== undefined && !!it.noDownload !== f.noDownload){ if (f.noDownload) it.noDownload = true; else delete it.noDownload; changed = true; }

async function playDriveViewer(it){
  const vid = $('#vid');
  vid.pause(); vid.removeAttribute('src'); vid.load(); vid.hidden = true;
  showAudioArt(null); showTapToPlay(false); showDiag('');
  S.viewOnly.add(it.id);
  if (S.sess) S.sess.viewer = true;
  if (!it.dur && it.media !== 'audio' && tokenValid()){
    try { it.dur = Number((await (await api(`${API}/files/${encodeURIComponent(it.id)}?fields=videoMediaMetadata(durationMillis)&supportsAllDrives=true`)).json()).videoMediaMetadata?.durationMillis) || undefined; } catch {}
    if (curItem() !== it) return;
  }
  const f = $('#drvframe');
  f.src = `https://drive.google.com/file/d/${encodeURIComponent(it.id)}/preview`;
  f.hidden = false;
  repaintEmbed(f);
  renderDriveNote(it);
}
function playCurrent(){
  const it = curItem(); if (!it) return;
  const vid = $('#vid'), ytw = $('#ytwrap');
  hideDriveViewer();
  beginSession(it);
  if (it.type === 'drive' && (it.noDownload || S.viewOnly.has(it.id))){
    try { ytPlayer?.stopVideo?.(); } catch {}
    ytw.hidden = true;
    playDriveViewer(it); renderPlayer(); return;
  }
  if (it.type === 'drive'){
    try { ytPlayer?.stopVideo?.(); } catch {}
    ytw.hidden = true; vid.hidden = false;
    showAudioArt(it.media === 'audio' ? it : null);
    const go = async () => {
      if (it.virtual && !it.size){ // pasted Drive link: look up size (for seeking) and whether it's audio
        try {
          const m = await (await api(`${API}/files/${encodeURIComponent(it.id)}?fields=size,mimeType,capabilities(canDownload),videoMediaMetadata(durationMillis)&supportsAllDrives=true`)).json();
          it.size = m.size; it.dur = Number(m.videoMediaMetadata?.durationMillis) || undefined;
          if (m.mimeType?.startsWith('audio/')){ it.media = 'audio'; showAudioArt(it); }
          if (m.capabilities?.canDownload === false){ if (curItem() === it){ playDriveViewer(it); } return; }
        } catch {}
        if (curItem() !== it) return;
      }
      vid.src = `drive-stream/${encodeURIComponent(it.id)}${it.size ? `?size=${it.size}` : ''}`;
      // Browsers may block auto-start after arriving from a link; offer a tap instead.
      vid.play().then(() => showTapToPlay(false)).catch(e => { if (e.name === 'NotAllowedError') showTapToPlay(true); });
    };
    if (tokenValid()) go(); else withToken(go);
  } else {
    vid.pause(); vid.removeAttribute('src'); vid.load();
    vid.hidden = true; ytw.hidden = false;
    showAudioArt(null); showTapToPlay(false);
    ensureYT().then(p => { p.loadVideoById(it.id); repaintEmbed(p.getIframe?.()); }).catch(() => { toast('YouTube player failed to load — skipping'); setTimeout(next, 1500); });
  }
  renderPlayer();
}
function next(){
  if (!S.queue.length) return;
  if (S.qi + 1 >= S.queue.length){
    if (S.loop) S.qi = 0;
    else { toast('Finished'); renderPlayer(); return; }
  } else S.qi++;
  playCurrent();
}
function prev(){ if (!S.queue.length) return; S.qi = Math.max(0, S.qi - 1); playCurrent(); }
function showDiag(text){ const d = $('#diag'); d.textContent = text; d.hidden = !text; }
const MEDIA_ERR = { 1: 'playback aborted', 2: 'network error while loading', 3: 'video data could not be decoded', 4: 'format not supported, or the stream failed' };
/* After a Drive video fails, ask the streaming helper for the first 2 bytes
   to separate "Drive refused" from "browser can't play this format". */
async function diagnoseDrive(it, code){
  const parts = [`Player: ${MEDIA_ERR[code] || 'unknown error'} (code ${code ?? '?'}).`];
  if (!navigator.serviceWorker?.controller){
    parts.push('Streaming helper is not active on this page — reload the page and try again.');
    return parts.join(' ');
  }
  try {
    const r = await fetch(`drive-stream/${encodeURIComponent(it.id)}${it.size ? `?size=${it.size}` : ''}`, { headers: { Range: 'bytes=0-1' } });
    if (!r.headers.get('X-FP-SW')){
      parts.push(`Stream test: got ${r.status} from the web host, not the streaming helper — make sure sw.js is uploaded next to index.html, then reload.`);
    } else if (r.ok){
      parts.push(`Stream test OK (${r.status}, ${r.headers.get('Content-Type') || 'no type'}): Drive is delivering the file, so this browser can't play its video format. Phone-recorded videos are often HEVC/H.265 — try Safari or Edge, or convert the file to H.264 MP4.`);
    } else {
      let msg = '';
      try { const t = await r.text(); try { msg = JSON.parse(t).error?.message || t; } catch { msg = t; } } catch {}
      parts.push(`Stream test: Drive answered ${r.status}${msg ? ` — "${String(msg).slice(0, 240)}"` : ''}.`);
      if (r.status === 403 && /cannot be downloaded|cannotDownloadFile/i.test(msg)) parts.viewOnly = true;
    }
  } catch (e){ parts.push('Stream test could not run: ' + e.message); }
  return parts.viewOnly ? { viewOnly: true } : parts.join(' ');
}

function toggleFull(){
  const st = $('#stage'), vid = $('#vid');
  if (document.fullscreenElement || document.webkitFullscreenElement){
    (document.exitFullscreen || document.webkitExitFullscreen).call(document); return;
  }
  if (st.requestFullscreen) st.requestFullscreen();

function setupVideoEvents(){
  const vid = $('#vid');
  vid.addEventListener('ended', () => { if (curItem()?.type === 'drive'){ if (S.sess) S.sess.done = true; next(); } });
  vid.addEventListener('timeupdate', () => {   // count only time actually played (not seeks)
    const x = S.sess; if (!x || curItem()?.type !== 'drive') return;
    const t = vid.currentTime;
    if (x.lastT != null){ const d = t - x.lastT; if (d > 0 && d < 2) x.heard += d * 1000; }
    x.lastT = t;
  });
  vid.addEventListener('seeking', () => { if (S.sess) S.sess.lastT = null; });
  vid.addEventListener('error', async () => {
    const it = curItem();
    if (it?.type !== 'drive' || !vid.getAttribute('src')) return;
    if (!tokenValid()){ S.resumeAt = vid.currentTime || 0; showAuthBanner(); return; }
    const code = vid.error?.code;
    const more = S.qi + 1 < S.queue.length || S.loop;
    showDiag(`#${it.num} couldn't play — checking why…`);
    const d = await diagnoseDrive(it, code);
    if (curItem() !== it) return;
    if (d?.viewOnly){ showDiag(''); playDriveViewer(it); toast('Downloads are off for this file — playing it in Google Drive\'s viewer', 4000); return; }
    toast(`#${it.num} couldn't play${more ? ' — skipping' : ''}. Details under the player.`, 4000);
    showDiag(`#${it.num} "${it.title}" couldn't play. ${d}`);
    if (more) setTimeout(next, 2500);
  });
  vid.addEventListener('playing', () => showDiag(''));
  vid.addEventListener('loadedmetadata', () => {
    if (S.resumeAt){ vid.currentTime = S.resumeAt; S.resumeAt = 0; }
    if (S.sess && !S.sess.dur && isFinite(vid.duration)) S.sess.dur = Math.round(vid.duration);
  });
  setInterval(() => {   // YouTube: count seconds while its player reports "playing"
    const x = S.sess;
    if (!x || curItem()?.type !== 'youtube' || ytPlayer?.getPlayerState?.() !== 1) return;
    x.heard += 1000;
    if (!x.dur){ const d = ytPlayer.getDuration?.(); if (d) x.dur = Math.round(d); }
  }, 1000);
  window.addEventListener('pagehide', () => endSession());
}

function readHashFolder(){
  const h = decodeURIComponent(location.hash);
  const m = h.match(/folder=([\w-]+)/);
  const p = h.match(/play=([\d,\s-]+)/);
  if (m) store.set('fp_folder', m[1]);
  if (p) S.pendingPlay = p[1];
  if (m || p) history.replaceState(null, '', location.pathname + location.search);
}
function runPendingPlay(){
  if (!S.pendingPlay || !S.cfg || !curProfile()) return;
  const { nums } = parseNumbers(S.pendingPlay);
  S.pendingPlay = null;

}

async function boot(){
  readHashFolder();
  if (CLIENT_ID.startsWith('PASTE')) return showGate('setup');
  if (!('serviceWorker' in navigator)) return showGate('nosw');
  try { await setupSW(); }
  catch (e){ return showGate('swfail', e.message); }
  try {
    const t = JSON.parse(sessionStorage.getItem('fp_tok') || 'null');
    if (t && t.exp > Date.now()){ S.token = t.token; S.tokenExp = t.exp; sendTokenToSW(); scheduleRefresh(); }
  } catch {}
  if (!tokenValid()) return showGate('signin');
  afterSignIn();
}
async function afterSignIn(){
  S.folderId = store.get('fp_folder');

  showGate('loading');
  try {
    S.cfgId = await findConfig(S.folderId);
    if (!S.cfgId) S.cfgId = await createConfig(S.folderId, normalizeCfg({}));
    S.cfg = await readConfig(S.cfgId);
  } catch (e){
    if (e instanceof AuthErr) return showGate('signin');
    return showGate('error', e.message);
  }
  S.profileId = store.get('fp_profile_' + S.folderId);
  if (S.cfg.items.some(i => i.type === 'youtube')) ensureYTApi().catch(() => {});
  if (!curProfile()) return showGate('profile');
  showApp();
  runPendingPlay();
  syncFolder(true).then(ensureCatalog).then(() => scheduleHistFlush(500));
}

function resolveLink(link, cfg = S.cfg){
  if (!link) return null;

    let host = ''; try { host = new URL(link.url).hostname.replace(/^www\./, ''); } catch {}
    const v = virtualItem(link.url);
    if (v) return { kind: 'item', item: v, url: link.url, host };   // plays inside the player
    return { kind: 'url', url: link.url, host };                      // any other website: new tab
  }

    const lib = (yt && cfg.items.find(i => i.type === 'youtube' && i.id === yt)) || (dr && cfg.items.find(i => i.type === 'drive' && i.id === dr));

/* Auto-link: match catalog titles to library file names, e.g.
   "High Frequency Activation" ↔ "HighFrequencyActivationSubliminalMeditation.mp4".
   Files whose name contains "intro" become the item's introduction. Only unique matches are used. */
const normKey = s => String(s).toLowerCase().normalize('NFKD').replace(/[^a-z0-9]/g, '');
function containsKey(hay, key){
  for (let i = hay.indexOf(key); i >= 0; i = hay.indexOf(key, i + 1)){
    const after = hay[i + key.length];
    if (!(/\d$/.test(key) && after && /\d/.test(after))) return true; // "part1" must not match "part12"
  }
  return false;
}
function autoLinkCatalog(cfg){
  let linked = 0;
  const lib = cfg.items.filter(i => !i.missing).map(i => ({ i, n: normKey(i.title) }));
  for (const sec of cfg.catalog.sections){
    const secWord = normKey(sec.title.split(/\s+/)[0] || '');
    for (const ci of sec.items){
      const keys = [normKey(ci.title)];
      if (/\d/.test(ci.part)) keys.push(secWord + normKey(ci.part));
      const find = intro => {
        const hits = lib.filter(x => keys.some(k => k.length >= 6 && containsKey(x.n, k)) && x.n.includes('intro') === intro);
        return hits.length === 1 ? hits[0].i : null;
      };
      if (!ci.link){ const h = find(false); if (h){ ci.link = { ref: refOf(h) }; linked++; } }
      if (!ci.intro){ const h = find(true); if (h){ ci.intro = { ref: refOf(h) }; linked++; } }
    }
  }

}

  const { secId, ciId } = S.dlg;
  const btn = $('#ci-save'); S.savingEditor = true; btn.disabled = true; btn.textContent = 'Saving…';
  const ok = await saveCfg(cfg => {
    const { sec, ci } = findCI(secId, ciId, cfg);
    if (!sec) throw new Error('that section was removed by someone else');
    if (ciId){ if (!ci) throw new Error('that meditation was removed by someone else'); Object.assign(ci, data); }
    else sec.items.push({ id: uid(), ...data });
  });
  S.savingEditor = false; btn.disabled = false; btn.textContent = 'Save';
  if (ok){ $('#cidlg').close(); toast('Saved'); }
  else editorError(`Couldn't save: ${S.lastSaveError || 'unknown error'}. Your changes are still here — check your connection or sign-in and press Save again.`);
}

/* ======================================================================
   HISTORY — one entry per thing played, saved to the profile in
   player-config.json. Entries wait in this browser until saved, so
   closing the tab mid-meditation doesn't lose them.
   ====================================================================== */
const localKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const keyToDate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const pendKey = (folder = S.folderId, prof = S.profileId) => `fp_hist_${folder}_${prof}`;
function readPending(key = pendKey()){ try { return JSON.parse(store.get(key) || '[]'); } catch { return []; } }
function beginSession(it){
  endSession();
  if (!it || !S.profileId) return;
  S.sess = { ref: refOf(it), title: it.title, num: it.virtual ? null : it.num, from: S.qLabel || '', start: Date.now(),
    heard: 0, lastT: null, done: false, viewer: false, dur: it.dur ? Math.round(it.dur / 1000) : null, prof: S.profileId, folder: S.folderId };
}
function endSession(){
  const x = S.sess; S.sess = null;
  if (!x) return;
  const heard = Math.round(x.heard / 1000);
  if (!x.done && !x.viewer && heard < 5) return;   // ignore accidental taps and quick skips
  const e = { id: uid(), at: new Date(x.start).toISOString(), ref: x.ref, title: x.title, num: x.num,
    heard: x.viewer ? null : heard, dur: x.dur || null, done: x.done };
  if (x.viewer) e.via = 'viewer';
  if (x.from && x.from !== x.title) e.from = x.from;
  const key = pendKey(x.folder, x.prof);
  store.set(key, JSON.stringify([...readPending(key), e].slice(-500)));
  scheduleHistFlush();
}
function scheduleHistFlush(delay = 4000){ clearTimeout(S.histT); S.histT = setTimeout(flushHistory, delay); }
async function flushHistory(){
  const pend = readPending();
  if (!pend.length || !S.cfgId || !curProfile() || !tokenValid()) return;   // retried after the next sign-in
  const ids = new Set(pend.map(e => e.id));
  const ok = await saveCfg(cfg => {
    const pr = curProfile(cfg); if (!pr) return;
    const have = new Set(pr.history.map(h => h.id));
    pr.history = [...pend.filter(e => !have.has(e.id)), ...pr.history].sort((a, b) => b.at.localeCompare(a.at)).slice(0, 1000);
  }, { quiet: true });
  if (ok){
    const left = readPending().filter(e => !ids.has(e.id));
    store.set(pendKey(), left.length ? JSON.stringify(left) : null);
    if (S.tab === 'history') render();
  }
}
function allHistory(p){
  const seen = new Set();
  return [...(p.id === S.profileId ? readPending() : []), ...(p.history || [])]
    .filter(e => !seen.has(e.id) && seen.add(e.id)).sort((a, b) => b.at.localeCompare(a.at));
}
const fmtMin = sec => sec == null ? '' : sec < 60 ? `${sec} s` : `${Math.round(sec / 60)} min`;
function relDay(iso){
  const days = Math.round((keyToDate(localKey(new Date())) - keyToDate(localKey(new Date(iso)))) / 864e5);
  return days <= 0 ? 'played today' : days === 1 ? 'played yesterday' : days < 7 ? `played ${days} days ago`
    : 'played ' + new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
function dayLabel(key){
  const days = Math.round((keyToDate(localKey(new Date())) - keyToDate(key)) / 864e5);
  return days === 0 ? 'Today' : days === 1 ? 'Yesterday' : keyToDate(key).toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
}
function histStatus(e){
  const how = e.done ? '<span class="ok">✓ finished</span>' : e.via === 'viewer' ? 'opened in Drive\'s viewer' : `${fmtMin(e.heard)}${e.dur ? ` of ${fmtMin(e.dur)}` : ''}`;
  return how + (e.from ? ` · from ${esc(e.from)}` : '');
}
function histRow(e, withTime = true){
  return `<li class="hrow">${withTime ? `<span class="htime">${new Date(e.at).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })}</span>` : ''}
    <span class="t"><b>${esc(e.title)}</b>${e.num ? ` <span class="mute">#${e.num}</span>` : ''}<span class="hs">${histStatus(e)}</span></span>
    <button class="btn sm" data-act="histplay" data-ref="${esc(e.ref)}" data-title="${esc(e.title)}" title="Play again">▶</button></li>`;
}
function viewHistory(p){
  const H = allHistory(p);
  if (!H.length) return `<div class="card"><h2>History · ${esc(p.name)}</h2><p class="mute">Nothing played yet. Everything ${esc(p.name)} plays (for at least a few seconds) shows up here, grouped by day.</p></div>`;
  const weekAgo = Date.now() - 7 * 864e5, week = H.filter(e => Date.parse(e.at) >= weekAgo);
  const mins = Math.round(week.reduce((t, e) => t + (e.heard || 0), 0) / 60);
  const daysActive = new Set(week.map(e => localKey(new Date(e.at)))).size;
  const groups = []; for (const e of H){ const k = localKey(new Date(e.at)); if (groups.at(-1)?.key !== k) groups.push({ key: k, list: [] }); groups.at(-1).list.push(e); }
  const show = S.histDays || 14;
  return `<div class="card"><h2>History · ${esc(p.name)} · last 7 days</h2>
    <div class="hstats"><div><b>${week.length}</b>sessions</div><div><b>${mins}</b>minutes listened</div><div><b>${daysActive}</b>day${daysActive === 1 ? '' : 's'} active</div></div></div>
  ${groups.slice(0, show).map(g => `<div class="card"><h2>${dayLabel(g.key)}</h2><ul class="list">${g.list.map(e => histRow(e)).join('')}</ul></div>`).join('')}
  <div class="row" style="margin:1rem 0">${groups.length > show ? `<button class="btn" data-act="histmore">Show older days</button>` : ''}<span class="sp"></span>
    <button class="btn danger" data-act="histclear">Clear ${esc(p.name)}'s history</button></div>`;
}

/* ======================================================================
   CALENDAR — playlists on specific dates, or repeating every weekday.
   ====================================================================== */
S.calMonth = (d => new Date(d.getFullYear(), d.getMonth(), 1))(new Date());
S.calDay = localKey(new Date());
function plansFor(p, key){
  const dk = DAYS[keyToDate(key).getDay()][0], out = [];
  for (const id of p.dated?.[key] || []){ const pl = p.playlists.find(x => x.id === id); if (pl) out.push({ pl, kind: 'date' }); }
  for (const id of p.schedule?.[dk] || []){ const pl = p.playlists.find(x => x.id === id); if (pl && !out.some(o => o.pl.id === id)) out.push({ pl, kind: 'weekly' }); }
  return out;
}
function viewCalendar(p){
  const m = S.calMonth, y = m.getFullYear(), mo = m.getMonth();
  const startDow = new Date(y, mo, 1).getDay(), nDays = new Date(y, mo + 1, 0).getDate(), today = localKey(new Date());
  const played = {}; for (const e of allHistory(p)){ const k = localKey(new Date(e.at)); played[k] = (played[k] || 0) + 1; }
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push('<span class="calcell blank" aria-hidden="true"></span>');
  for (let d = 1; d <= nDays; d++){
    const key = localKey(new Date(y, mo, d)), plans = plansFor(p, key);
    const label = `${keyToDate(key).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' })}: ${plans.length ? plans.map(x => x.pl.name).join(', ') : 'nothing planned'}${played[key] ? `, ${played[key]} played` : ''}`;
    cells.push(`<button class="calcell ${key === today ? 'today' : ''} ${key < today ? 'past' : ''} ${key === S.calDay ? 'sel' : ''}" data-act="calday" data-key="${key}" aria-label="${esc(label)}" aria-pressed="${key === S.calDay}">
      <span class="dnum">${d}</span>
      ${plans.slice(0, 2).map(x => `<span class="pchip ${x.kind === 'weekly' ? 'wk' : ''}">${esc(x.pl.name)}</span>`).join('')}${plans.length > 2 ? `<span class="pmore">+${plans.length - 2} more</span>` : ''}
      ${played[key] ? `<span class="played">✓ ${played[key]}</span>` : ''}</button>`);
  }
  return `<div class="card"><h2>Calendar · ${esc(p.name)}</h2>
    <div class="calhead"><button class="iconbtn" data-act="calnav" data-dir="-1" aria-label="Previous month" style="transform:rotate(90deg)">${ICONS.down}</button>
      <span class="mname">${m.toLocaleDateString(undefined, { month: 'long', year: 'numeric' })}</span>
      <button class="btn sm" data-act="calnav" data-dir="0">Today</button>
      <button class="iconbtn" data-act="calnav" data-dir="1" aria-label="Next month" style="transform:rotate(-90deg)">${ICONS.down}</button></div>
    <div class="calgrid">${DAYS.map(([, n]) => `<span class="caldow">${n.slice(0, 3)}</span>`).join('')}${cells.join('')}</div>
    <p class="mute" style="font-size:.8rem;margin:.6rem 0 0">Solid = that date only · dashed = repeats weekly · ✓ = played that day. Tap a day to plan it.</p>
    ${dayPanel(p, S.calDay)}</div>`;
}
function dayPanel(p, key){
  const d = keyToDate(key), [dk, dn] = DAYS[d.getDay()], plans = plansFor(p, key);
  const playedThatDay = allHistory(p).filter(e => localKey(new Date(e.at)) === key).reverse();
  return `<div class="daypanel"><h3>${d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })}</h3>
    <ul class="list">${plans.map(({ pl, kind }) => `<li><span class="t"><b>${esc(pl.name)}</b> <span class="mute">· ${kind === 'weekly' ? `every ${dn}` : 'this day only'} · ${pl.items.length} item${pl.items.length === 1 ? '' : 's'}</span></span>
      <button class="btn sm" data-act="playpl" data-id="${pl.id}">▶</button>
      <button class="btn sm danger" data-act="calrm" data-kind="${kind}" data-id="${pl.id}" title="${kind === 'weekly' ? `Stop repeating every ${dn}` : 'Remove from this day'}">✕</button></li>`).join('') || '<li class="mute">Nothing planned.</li>'}</ul>
    ${p.playlists.length ? `<div class="row" style="margin-top:.6rem"><select id="cal-pl" aria-label="Playlist to add">${p.playlists.map(pl => `<option value="${pl.id}">${esc(pl.name)}</option>`).join('')}</select>
      <label class="cb"><input type="checkbox" id="cal-rep">Every ${dn}</label>
      <button class="btn pri" data-act="caladd">＋ Add</button></div>`
      : `<p class="mute">Make a playlist first (above), then add it to days here.</p>`}
    ${playedThatDay.length ? `<h2 style="margin-top:1rem">Played</h2><ul class="list">${playedThatDay.map(e => histRow(e)).join('')}</ul>` : ''}</div>`;
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, n = Number(b.dataset.n), i = Number(b.dataset.i), p = curProfile();
  switch (a){
    case 'signin':
      requestToken('').then(afterSignIn).catch(err => toast(err.message, 4500)); break;
    case 'reauth':
      requestToken('').then(() => { if (curItem()?.type === 'drive' && S.resumeAt) playCurrent(); }).catch(err => toast(err.message, 4500)); break;
    case 'setfolder': {
      const id = parseFolderId($('#folderin').value);
      if (!id) return toast('Paste the folder\'s link from Google Drive');
      store.set('fp_folder', id); afterSignIn(); break;
    }
    case 'retry': afterSignIn(); break;
    case 'changefolder':
      if (S.cfg && !confirm('Switch to a different Drive folder?')) return;
      stopPlayer(); store.set('fp_folder', null); S.cfg = null; showGate('folder'); break;
    case 'pickprofile': pickProfile(b.dataset.id); break;
    case 'createprofile': {
      const name = $('#newprof').value.trim(); if (!name) return toast('Type a name first');
      const id = uid();
      if (await saveCfg(cfg => { cfg.profiles.push({ id, name, playlists: [], schedule: {}, dated: {}, history: [] }); })) pickProfile(id);
      break;
    }
    case 'switchprofile': stopPlayer(); showGate('profile'); break;
    case 'renameprofile': {
      const name = prompt('Rename profile', p.name); if (!name?.trim()) return;
      saveCfg(cfg => { const x = curProfile(cfg); if (x) x.name = name.trim(); }); break;
    }
    case 'deleteprofile':
      if (!confirm(`Delete profile "${p.name}" and all its playlists?`)) return;
      if (await saveCfg(cfg => { cfg.profiles = cfg.profiles.filter(x => x.id !== S.profileId); })){ S.profileId = null; showGate('profile'); }
      break;
    case 'tab': S.tab = b.dataset.tab; S.editing = null; render(); break;
    /* catalog */
    case 'catf': { const k = b.dataset.k; S.catF.has(k) ? S.catF.delete(k) : S.catF.add(k); render(); break; }
    case 'catnotes': S.showNotes = !S.showNotes; store.set('fp_shownotes', S.showNotes ? '1' : null); S.openNotes.clear(); render(); break;
    case 'catedit': S.catEdit = !S.catEdit; if (S.catEdit){ S.catSel = false; S.sel = []; } render(); break;
    case 'sectoggle': {
      const id = b.dataset.sec;
      S.collapsed.has(id) ? S.collapsed.delete(id) : S.collapsed.add(id);
      store.set('fp_collapsed', JSON.stringify([...S.collapsed]));
      rerenderCatalog(); break;
    }
    case 'catsel': S.catSel = !S.catSel; S.sel = []; if (S.catSel) S.catEdit = false; render(); break;
    case 'cisel': {
      const li = b.closest('li.ci'), key = { sec: li.dataset.sec, ci: li.dataset.ci };
      const i0 = S.sel.findIndex(x => x.ci === key.ci);
      if (i0 >= 0) S.sel.splice(i0, 1); else S.sel.push(key);
      rerenderCatalog(); break;
    }
    case 'selintros': S.selIntros = b.checked; break;
    /* history */
    case 'histplay': {
      const ref = b.dataset.ref, [type, ...rest] = ref.split(':'), id = rest.join(':');
      const it = itemByRef(ref) || { type, id, title: b.dataset.title, num: '↗', virtual: true, media: 'video' };
      if (it.missing) return toast('That file is no longer in the Drive folder');
      startQueue([it.virtual ? it : asQueued(it, it.title)], b.dataset.title); break;
    }
    case 'histmore': S.histDays = (S.histDays || 14) + 30; render(); break;
    case 'histclear': {
      if (!confirm(`Clear all of ${p.name}'s play history? This can't be undone.`)) return;
      store.set(pendKey(), null);
      if (await saveCfg(cfg => { const pr = curProfile(cfg); if (pr) pr.history = []; })) toast('History cleared');
      break;
    }
    /* calendar */
    case 'calnav': {
      const dir = Number(b.dataset.dir), m = S.calMonth;
      if (dir === 0){ const t = new Date(); S.calMonth = new Date(t.getFullYear(), t.getMonth(), 1); S.calDay = localKey(t); }
      else S.calMonth = new Date(m.getFullYear(), m.getMonth() + dir, 1);
      render(); break;
    }
    case 'calday': S.calDay = b.dataset.key; render(); break;
    case 'caladd': {
      const id = $('#cal-pl').value, weekly = $('#cal-rep').checked, key = S.calDay, dk = DAYS[keyToDate(key).getDay()][0];
      const ok = await saveCfg(cfg => {
        const pr = curProfile(cfg); if (!pr) return;
        const arr = weekly ? (pr.schedule[dk] ||= []) : (pr.dated[key] ||= []);
        if (!arr.includes(id)) arr.push(id);
      });
      if (ok) toast(weekly ? `Added — repeats every ${DAYS[keyToDate(key).getDay()][1]}` : 'Added to this day');
      break;
    }
    case 'calrm': {
      const id = b.dataset.id, key = S.calDay, [dk, dn] = DAYS[keyToDate(key).getDay()];
      if (b.dataset.kind === 'weekly' && !confirm(`Stop repeating this playlist every ${dn}? (It's removed from all ${dn}s.)`)) return;
      saveCfg(cfg => {
        const pr = curProfile(cfg); if (!pr) return;
        if (b.dataset.kind === 'weekly') pr.schedule[dk] = (pr.schedule[dk] || []).filter(x => x !== id);
        else { pr.dated[key] = (pr.dated[key] || []).filter(x => x !== id); if (!pr.dated[key].length) delete pr.dated[key]; }
      }); break;
    }
    case 'autonext': {
      const it = curItem(); if (!it?.dur) return;
      clearAutoNext(); S.autoNextAt = Date.now() + it.dur + 3000;
      S.autoNextT = setInterval(() => {
        if (curItem() !== it){ clearAutoNext(); return; }
        if (Date.now() >= S.autoNextAt){ clearAutoNext(); next(); return; }
        const btn = document.querySelector('[data-act=autonextcancel]');
        if (btn) btn.textContent = `⏱ Next in ${fmtDur(S.autoNextAt - Date.now())} · Cancel`;
      }, 1000);
      renderDriveNote(it); break;
    }
    case 'autonextcancel': clearAutoNext(); if (curItem()) renderDriveNote(curItem()); break;
    case 'selclear': S.sel = []; rerenderCatalog(); break;
    case 'selplay': {
      const items = selectionItems();
      if (!items.length) return toast('Nothing playable selected');
      startQueue(items, 'Selection'); break;
    }
    case 'selsave': {
      const items = selectionItems();
      const nums = items.filter(it => !it.virtual).map(it => it.num);
      const skipped = items.length - nums.length;
      if (!nums.length) return toast('These are pasted links, not library files — add them to the Library to save them in a playlist', 5000);
      const name = prompt(`Name for this playlist (${nums.length} item${nums.length === 1 ? '' : 's'})`); if (!name?.trim()) return;
      const ok = await saveCfg(cfg => { const pr = curProfile(cfg); if (pr) pr.playlists.push({ id: uid(), name: name.trim(), items: nums }); });
      if (ok) toast(`Saved "${name.trim()}" to ${p.name}'s playlists${skipped ? ` — ${skipped} pasted link${skipped === 1 ? '' : 's'} left out (not in the Library)` : ''}`, 5000);
      break;
    }
    case 'cinote': case 'ciplay': case 'ciintro': case 'ciboth': case 'ciedit': case 'cimove': {
      const li = b.closest('li.ci'), { sec, ci } = findCI(li.dataset.sec, li.dataset.ci);
      if (!ci) return;
      if (a === 'cinote'){
        if (S.showNotes){ S.showNotes = false; store.set('fp_shownotes', null); sec.items.forEach(x => x.note && x.id !== ci.id && S.openNotes.add(x.id)); }
        else S.openNotes.has(ci.id) ? S.openNotes.delete(ci.id) : S.openNotes.add(ci.id);
        render();
      } else if (a === 'ciplay') openLink(ci.link, ci.title);
      else if (a === 'ciintro') openLink(ci.intro, `${ci.title} — introduction`);
      else if (a === 'ciboth'){
        const r = resolveLink(ci.link), ri = resolveLink(ci.intro);
        if (r?.kind === 'item' && ri?.kind === 'item') startQueue([asQueued(ri.item, `${ci.title} — introduction`), asQueued(r.item, ci.title)], ci.title);
      } else if (a === 'ciedit') openEditor(sec.id, ci.id);
      else if (a === 'cimove'){
        const dir = Number(b.dataset.dir), secId = sec.id, ciId = ci.id;
        saveCfg(cfg => { const s = cfg.catalog.sections.find(x => x.id === secId); const i0 = s?.items.findIndex(x => x.id === ciId); const j = i0 + dir;
          if (s && i0 >= 0 && j >= 0 && j < s.items.length) [s.items[i0], s.items[j]] = [s.items[j], s.items[i0]]; });
      }
      break;
    }
    case 'cisave': saveEditor(); break;
    case 'ciclose': $('#cidlg').close(); break;
    case 'cidelete': {
      const { secId, ciId } = S.dlg, { ci } = findCI(secId, ciId);
      if (!confirm(`Delete "${ci?.title}" from the catalog? (The file stays in your library.)`)) return;
      if (await saveCfg(cfg => { const s = cfg.catalog.sections.find(x => x.id === secId); if (s) s.items = s.items.filter(x => x.id !== ciId); })){ $('#cidlg').close(); toast('Deleted'); }
      break;
    }
    case 'secplay': {
      const sec = S.cfg.catalog.sections.find(s => s.id === b.dataset.sec);
      startQueue(sec.items.map(ci => [ci, resolveLink(ci.link)]).filter(([, r]) => r?.kind === 'item').map(([ci, r]) => asQueued(r.item, ci.title)), sec.title); break;
    }
    case 'secadd': openEditor(b.dataset.sec, null); break;
    case 'secnew': {
      const title = prompt('Name of the new section'); if (!title?.trim()) return;
      saveCfg(cfg => { cfg.catalog.sections.push({ id: uid(), title: title.trim(), tag: '', items: [] }); }); break;
    }
    case 'secedit': {
      const sec = S.cfg.catalog.sections.find(s => s.id === b.dataset.sec);
      const title = prompt('Section name', sec.title); if (title == null || !title.trim()) return;
      const tag = prompt('Small label under the name (leave empty for none)', sec.tag || ''); if (tag == null) return;
      saveCfg(cfg => { const s = cfg.catalog.sections.find(x => x.id === sec.id); if (s){ s.title = title.trim(); s.tag = tag.trim(); } }); break;
    }
    case 'secmove': {
      const id = b.dataset.sec, dir = Number(b.dataset.dir);
      saveCfg(cfg => { const L = cfg.catalog.sections, i0 = L.findIndex(x => x.id === id), j = i0 + dir; if (i0 >= 0 && j >= 0 && j < L.length) [L[i0], L[j]] = [L[j], L[i0]]; }); break;
    }
    case 'secdel': {
      const sec = S.cfg.catalog.sections.find(s => s.id === b.dataset.sec);
      if (!confirm(`Delete the section "${sec.title}" and its ${sec.items.length} catalog entries? (Files stay in your library.)`)) return;
      saveCfg(cfg => { cfg.catalog.sections = cfg.catalog.sections.filter(x => x.id !== sec.id); }); break;
    }
    case 'catautolink': {
      const n = await saveCfg(cfg => autoLinkCatalog(cfg));
      if (n !== null) toast(n ? `Linked ${n} item${n === 1 ? '' : 's'} by matching file names` : 'No new unique matches found — link the rest by number');
      break;
    }
    case 'quickplay': {
      S.quick = $('#quick').value;
      const { nums, bad } = parseNumbers(S.quick);
      if (bad.length) toast(`Ignored: ${bad.join(' ')}`);
      if (!nums.length) return toast('Type some numbers first');
      playQueue(nums, 'Quick play'); break;
    }
    case 'playpl': {
      const pl = p.playlists.find(x => x.id === b.dataset.id);
      if (!pl?.items.length) return toast('That playlist is empty');
      playQueue(pl.items, pl.name); break;
    }
    case 'playone': playQueue([n], ''); break;
    case 'enqueue': {
      const it = itemByNum(n);
      if (!S.queue.length) playQueue([n], 'Queue');
      else { S.queue.push(it); renderPlayer(); toast(`#${n} added to queue`); }
      break;
    }
    case 'renumber': {
      const it = itemByNum(n);
      const ans = prompt(`New number for "${it.title}" (currently #${n})`, n);
      if (ans == null || !ans.trim()) return;
      const to = Number(ans.trim());
      if (!Number.isInteger(to) || to < 1 || to > 99999) return toast('Use a whole number from 1 to 99999');
      if (to === n) return;
      const other = itemByNum(to);
      if (other && !confirm(`#${to} is already "${other.title}".\n\nSwap them? "${it.title}" becomes #${to} and "${other.title}" becomes #${n}. Playlists are updated to match.`)) return;
      const key = { type: it.type, id: it.id };
      const ok = await saveCfg(cfg => {
        // Re-find by identity in the freshest config, in case numbers moved since we looked.
        const cur = cfg.items.find(q => q.type === key.type && q.id === key.id);
        if (!cur) throw new Error('that file is no longer in the library');
        return renumberItem(cfg, cur.num, to);
      });
      if (ok){
        S.queue = S.queue.map(q => S.cfg.items.find(i => i.type === q.type && i.id === q.id) || q);
        renderPlayer();
        toast(other ? `Swapped: "${it.title}" is #${to}, "${other.title}" is #${n}` : `"${it.title}" is now #${to}`, 3500);
      }
      break;
    }
    case 'rename': {
      const it = itemByNum(n); const t = prompt(`Rename #${n}`, it.title); if (!t?.trim()) return;
      saveCfg(cfg => { const x = cfg.items.find(q => q.num === n); if (x) x.title = t.trim(); }); break;
    }
    case 'remove':
      if (!confirm(`Remove #${n} from the library? It will also be taken out of every playlist. The number won't be reused.`)) return;
      saveCfg(cfg => {
        cfg.items = cfg.items.filter(q => q.num !== n);
        cfg.profiles.forEach(pr => pr.playlists.forEach(pl => { pl.items = pl.items.filter(x => x !== n); }));
      }); break;
    case 'addyt': await addYouTube($('#yturl').value); break;
    case 'sync': syncFolder(false); break;
    case 'newpl': S.editing = { id: null, name: '', items: [] }; render(); break;
    case 'editpl': {
      const pl = p.playlists.find(x => x.id === b.dataset.id);
      S.editing = { id: pl.id, name: pl.name, items: pl.items.slice() }; render(); break;
    }
    case 'ed-add': {
      S.editing.name = $('#ed-name').value;
      const { nums, bad } = parseNumbers($('#ed-add').value);
      if (bad.length) toast(`Ignored: ${bad.join(' ')}`);
      const unknown = nums.filter(x => !itemByNum(x));
      if (unknown.length) toast(`Not in library: #${unknown.join(', #')}`, 4000);
      S.editing.items.push(...nums.filter(x => itemByNum(x))); render(); break;
    }
    case 'ed-up': case 'ed-down': {
      S.editing.name = $('#ed-name').value;
      const arr = S.editing.items, j = a === 'ed-up' ? i - 1 : i + 1;
      if (j < 0 || j >= arr.length) return;
      [arr[i], arr[j]] = [arr[j], arr[i]]; render(); break;
    }
    case 'ed-del': S.editing.name = $('#ed-name').value; S.editing.items.splice(i, 1); render(); break;
    case 'ed-cancel': S.editing = null; render(); break;
    case 'ed-save': {
      const ed = S.editing, name = $('#ed-name').value.trim();
      if (!name) return toast('Give the playlist a name');
      const ok = await saveCfg(cfg => {
        const pr = curProfile(cfg); if (!pr) return;
        const pl = ed.id && pr.playlists.find(x => x.id === ed.id);
        if (pl){ pl.name = name; pl.items = ed.items; }
        else pr.playlists.push({ id: ed.id || uid(), name, items: ed.items });
      });
      if (ok){ S.editing = null; render(); toast('Saved'); }
      break;
    }
    case 'ed-delete': {
      const ed = S.editing;
      if (!confirm('Delete this playlist?')) return;
      if (await saveCfg(cfg => {
        const pr = curProfile(cfg); if (!pr) return;
        pr.playlists = pr.playlists.filter(x => x.id !== ed.id);
        for (const k in pr.schedule) pr.schedule[k] = pr.schedule[k].filter(x => x !== ed.id);
        for (const k in pr.dated){ pr.dated[k] = pr.dated[k].filter(x => x !== ed.id); if (!pr.dated[k].length) delete pr.dated[k]; }
      })){ S.editing = null; render(); }
      break;
    }
    case 'prev': prev(); break;
    case 'next': next(); break;
    case 'jump': S.qi = i; playCurrent(); break;
    case 'loop': S.loop = !S.loop; renderPlayer(); break;
    case 'full': toggleFull(); break;
    case 'close': stopPlayer(); break;
    case 'copylink': {
      const link = location.origin + location.pathname + '#folder=' + S.folderId;
      navigator.clipboard?.writeText(link).then(() => toast('Link copied')).catch(() => prompt('Copy this link:', link));
      if (!navigator.clipboard) prompt('Copy this link:', link);
      break;
    }
    case 'signout':
      if (!confirm('Sign out of Google on this device?')) return;
      stopPlayer();
      try { google.accounts.oauth2.revoke(S.token, () => {}); } catch {}
      S.token = null; S.tokenExp = 0; S.cfg = null;
      try { sessionStorage.removeItem('fp_tok'); } catch {}
      navigator.serviceWorker?.controller?.postMessage({ type: 'signout' });
      showGate('signin'); break;
  }
});
document.addEventListener('change', e => {
  const day = e.target.dataset?.day; if (!day) return;
  const val = e.target.value;
  saveCfg(cfg => { const pr = curProfile(cfg); if (!pr) return; if (val) pr.schedule[day] = val; else delete pr.schedule[day]; })
    .then(ok => ok && toast('Schedule saved'));
});
document.addEventListener('input', e => {
  if (e.target.id === 'filter'){ S.filter = e.target.value; $('#librows').innerHTML = libRows(); }
  else if (e.target.id === 'catq'){ S.catQ = e.target.value; rerenderCatalog(); }
  else if (e.target.id === 'ci-link' || e.target.id === 'ci-intro') linkHint(e.target.id);
  else if (e.target.id === 'quick') S.quick = e.target.value;
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (['ci-part', 'ci-title', 'ci-link', 'ci-intro'].includes(e.target.id)){ e.preventDefault(); return saveEditor(); }
  const map = { quick: 'quickplay', yturl: 'addyt', folderin: 'setfolder', newprof: 'createprofile', 'ed-add': 'ed-add' };
  const act = map[e.target.id]; if (act) document.querySelector(`[data-act="${act}"]`)?.click();
});
setupVideoEvents();
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="gisLoaded()" onerror="document.getElementById('gate').innerHTML='<p>Could not load Google sign-in. Check your connection and reload.</p>'"></script>
</body>
